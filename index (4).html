<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Before/After</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; }
        h1 { text-align: center; }
        .card { background: #1e1e1e; border-radius: 12px; padding: 15px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: flex; flex-direction: column; align-items: center; }
        .slider-container { position: relative; width: 100%; max-width: 800px; line-height: 0; border-radius: 8px; overflow: hidden; user-select: none; }
        .slider-container img { display: block; width: 100%; height: auto; pointer-events: none; }
        .img-after-wrap { position: absolute; top: 0; left: 0; width: 100%; height: 100%; clip-path: inset(0 50% 0 0); border-right: 3px solid #fff; }
        .img-after-wrap img { width: 100%; height: 100%; object-fit: contain; }
        .range-input { position: absolute; bottom: 15px; left: 5%; width: 90%; z-index: 10; cursor: pointer; }
        
        /* Update Banner Popup */
        #update-banner { display: none; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #ff9800; color: #000; padding: 12px 20px; border-radius: 30px; font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.3); z-index: 1000; cursor: pointer; }
    </style>
</head>
<body>

    <h1>My Portfolio</h1>
    <div id="card-container"></div>

    <div id="update-banner">🔄 New update available! Click to reload.</div>

    <script>
        // --- ADD / EDIT YOUR CARDS CONFIG HERE ---
        const portfolioCards = [
            {
                header: "Wall Holes Repair",
                before: "https://images.unsplash.com/photo-1513694203232-719a280e022f?w=600",
                after: "https://images.unsplash.com/photo-1581092160607-ee22621dd758?w=600"
            },
            {
                header: "Kitchen Renovation",
                before: "https://images.unsplash.com/photo-1503387762-592deb58ef4e?w=600",
                after: "https://images.unsplash.com/photo-1556911220-e15b29be8c8f?w=600"
            }
        ];

        const container = document.getElementById("card-container");

        portfolioCards.forEach(item => {
            container.innerHTML += `
                <div class="card">
                    <h3>${item.header}</h3>
                    <div class="slider-container">
                        <img src="${item.before}" alt="Before">
                        <div class="img-after-wrap">
                            <img src="${item.after}" alt="After">
                        </div>
                        <input type="range" min="0" max="100" value="50" class="range-input">
                    </div>
                </div>
            `;
        });

        // Slider Mask Logic (Using clip-path for clean anchoring and no stretching)
        document.querySelectorAll('.slider-container').forEach(slider => {
            const range = slider.querySelector('.range-input');
            const afterWrap = slider.querySelector('.img-after-wrap');
            
            range.addEventListener('input', (e) => {
                const val = e.target.value;
                // Clips from the right side based on range value
                afterWrap.style.clipPath = `inset(0 ${100 - val}% 0 0)`;
            });
        });

        // --- SERVICE WORKER REGISTRATION ---
        let swReg = null;
        let waitingWorker = null;

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').then(reg => {
                swReg = reg;

                reg.addEventListener('updatefound', () => {
                    const newWorker = reg.installing;
                    newWorker.addEventListener('statechange', () => {
                        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                            waitingWorker = reg.waiting || newWorker;
                        }
                    });
                });
            });

            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (refreshing) return;
                refreshing = true;
                window.location.reload();
            });

            document.getElementById('update-banner').addEventListener('click', () => {
                triggerUpdate();
            });
        }

        // --- CONTENT-DIFF UPDATE CHECKER ---
        // Instead of relying on the browser's own (slow/unreliable) sw.js byte-diff cycle,
        // fetch the live index.html directly, hash it, and compare against the hash of what
        // we last cached/saw. This catches ANY change in the deployed repo within one interval.
        const CHECK_INTERVAL_MS = 60 * 1000; // scan every 1 minute
        const HASH_STORAGE_KEY = 'portfolio-content-hash';

        async function hashText(text) {
            const enc = new TextEncoder().encode(text);
            const digest = await crypto.subtle.digest('SHA-256', enc);
            return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function checkForUpdate() {
            try {
                // cache: 'no-store' forces an actual network round-trip to the repo, bypassing
                // the HTTP cache and the service worker entirely, so we always see the real file.
                const resp = await fetch('./index.html?_ts=' + Date.now(), { cache: 'no-store' });
                if (!resp.ok) return;
                const liveText = await resp.text();
                const liveHash = await hashText(liveText);
                const lastHash = localStorage.getItem(HASH_STORAGE_KEY);

                if (lastHash === null) {
                    // First run ever: just record the baseline, nothing to compare yet.
                    localStorage.setItem(HASH_STORAGE_KEY, liveHash);
                    return;
                }

                if (liveHash !== lastHash) {
                    // Repo content differs from what we saw last check -> show banner immediately.
                    document.getElementById('update-banner').style.display = 'block';
                    localStorage.setItem(HASH_STORAGE_KEY, liveHash);
                    // Also nudge the service worker to fetch/activate the new version in the background.
                    if (swReg) swReg.update().catch(() => {});
                }
            } catch (e) {
                // offline or blocked fetch — skip this cycle silently
            }
        }

        async function triggerUpdate() {
            // 1) Wipe every cache this origin owns, so nothing stale survives.
            if ('caches' in window) {
                const keys = await caches.keys();
                await Promise.all(keys.map(k => caches.delete(k)));
            }
            // 2) If a new worker is already installed & waiting, activate it now.
            if (waitingWorker) {
                waitingWorker.postMessage('SKIP_WAITING');
                return; // controllerchange listener will reload the page
            }
            // 3) Otherwise force the SW registration to re-check, then hard-reload.
            if (swReg) await swReg.update().catch(() => {});
            window.location.reload();
        }

        checkForUpdate(); // run once on load
        setInterval(checkForUpdate, CHECK_INTERVAL_MS);
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') checkForUpdate();
        });
    </script>
</body>
</html>
